# Railway service builder must be set to NIXPACKS.

[phases.setup]
nixPkgs = ["nodejs", "python3", "uv", "ffmpeg"]
nixLibs = ["zlib", "stdenv.cc.cc.lib"]

[phases.install]
cmds = [
  "uv pip install --python python3 --target /app/pylib -r motor/requirements.txt",
  "npm ci"
]

[variables]
PYTHONPATH = "/app/pylib"
LD_LIBRARY_PATH = "/root/.nix-profile/lib"
