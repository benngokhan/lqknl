name: Mira Continuous Content Intake Worker

on:
  schedule:
    # Her saat çalışır; mevcut video üretim akışından ayrı tutulur.
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mira-continuous-content-intake
  cancel-in-progress: false

jobs:
  collect-save-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate required secrets
        env:
          MIRA_BASE_URL: ${{ secrets.MIRA_BASE_URL }}
          MIRA_AUTOMATION_SECRET: ${{ secrets.MIRA_AUTOMATION_SECRET }}
        run: |
          test -n "$MIRA_BASE_URL" || (echo "Missing GitHub Actions secret: MIRA_BASE_URL" && exit 1)
          test -n "$MIRA_AUTOMATION_SECRET" || (echo "Missing GitHub Actions secret: MIRA_AUTOMATION_SECRET" && exit 1)
      - name: Research current topics and save them to Mira
        continue-on-error: true
        env:
          MIRA_BASE_URL: ${{ secrets.MIRA_BASE_URL }}
          MIRA_AUTOMATION_SECRET: ${{ secrets.MIRA_AUTOMATION_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 75 -X POST "${MIRA_BASE_URL%/}/api/automation/research" -H "x-mira-key: ${MIRA_AUTOMATION_SECRET}" -H "Content-Type: application/json" -d '{}'
      - name: Process one queued item and save its draft to the panel
        continue-on-error: true
        env:
          MIRA_BASE_URL: ${{ secrets.MIRA_BASE_URL }}
          MIRA_AUTOMATION_SECRET: ${{ secrets.MIRA_AUTOMATION_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 75 -X POST "${MIRA_BASE_URL%/}/api/automation/worker" -H "x-mira-key: ${MIRA_AUTOMATION_SECRET}" -H "Content-Type: application/json" -d '{}'
      - name: Analyze newly saved drafts
        continue-on-error: true
        env:
          MIRA_BASE_URL: ${{ secrets.MIRA_BASE_URL }}
          MIRA_AUTOMATION_SECRET: ${{ secrets.MIRA_AUTOMATION_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 75 -X POST "${MIRA_BASE_URL%/}/api/automation/analyze-drafts" -H "x-mira-key: ${MIRA_AUTOMATION_SECRET}" -H "Content-Type: application/json" -d '{}'
