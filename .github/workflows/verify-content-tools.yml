name: Verify Mira Content Tools

on:
  push:
    branches: [main]
    paths:
      - "mira-prompt/**"
      - "motor/**"
      - "signal-loop/**"
      - ".github/workflows/verify-content-tools.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: |
          python -m py_compile motor/shorts_pipeline.py
          python -m py_compile motor/mira_adapter.py
          python -m py_compile motor/qc_check.py
          python -m py_compile signal-loop/channel_pulse.py
      - name: Validate JSON files and required font assets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in [
              "mira-prompt/MIRA_STYLE_SPEC.json",
              "mira-prompt/mira_content_schema.json",
              "mira-prompt/shorts_config.example.json",
          ]:
              json.loads(Path(name).read_text(encoding="utf-8"))
              print("JSON OK:", name)
          for name in [
              "mira-prompt/font/raw/archivo.ttf",
              "mira-prompt/font/raw/inter.ttf",
              "mira-prompt/font/raw/anton.ttf",
          ]:
              path = Path(name)
              assert path.is_file() and path.stat().st_size > 1000, f"Missing/empty font: {name}"
              print("FONT OK:", name)
          PY
