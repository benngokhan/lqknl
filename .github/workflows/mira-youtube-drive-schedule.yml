name: Mira Drive-to-YouTube Schedule

on:
  # Automated uploads publish publicly immediately; times are UTC (Türkiye = UTC+03).
  # Normal day: 12:00, 16:30, 20:00 Türkiye time (3 Shorts).
  # Long-video day: 12:00 Short, 18:00 long video, 20:00 Short; afternoon Short is skipped.
  schedule:
    - cron: "0 9 * * *"
    - cron: "30 13 * * *"
    - cron: "0 15 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "shorts-noon, shorts-afternoon, shorts-evening, or long"
        required: true
        type: choice
        options:
          - shorts-noon
          - shorts-afternoon
          - shorts-evening
          - long
      mode:
        description: "scheduled uploads privately for automatic publication; immediate publishes publicly now"
        required: true
        default: immediate
        type: choice
        options:
          - scheduled
          - immediate
      file_name:
        description: "Optional exact Drive filename, e.g. video_17.mp4 (scheduled mode only)"
        required: false
        type: string
      publish_at:
        description: "Optional future UTC time for scheduled mode; automated daily slots publish publicly immediately"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mira-youtube-schedule-${{ github.event.schedule || inputs.slot || 'manual' }}
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Select scheduled slot
        id: slot
        shell: bash
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_SLOT: ${{ inputs.slot }}
          MANUAL_MODE: ${{ inputs.mode }}
          # Read raw workflow_dispatch inputs explicitly.
          MANUAL_FILE_NAME: ${{ github.event.inputs.file_name }}
          MANUAL_PUBLISH_AT: ${{ github.event.inputs.publish_at }}
        run: |
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "file_name=" >> "$GITHUB_OUTPUT"
          echo "publish_at=" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_SCHEDULE" == "0 9 * * *" ]]; then
            echo "slot=shorts-noon" >> "$GITHUB_OUTPUT"
            echo "mode=immediate" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_SCHEDULE" == "30 13 * * *" ]]; then
            echo "slot=shorts-afternoon" >> "$GITHUB_OUTPUT"
            echo "mode=immediate" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_SCHEDULE" == "0 15 * * *" ]]; then
            echo "slot=long" >> "$GITHUB_OUTPUT"
            echo "mode=immediate" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_SCHEDULE" == "0 17 * * *" ]]; then
            echo "slot=shorts-evening" >> "$GITHUB_OUTPUT"
            echo "mode=immediate" >> "$GITHUB_OUTPUT"
          else
            echo "slot=$MANUAL_SLOT" >> "$GITHUB_OUTPUT"
            echo "mode=${MANUAL_MODE:-immediate}" >> "$GITHUB_OUTPUT"
            if [[ -n "$MANUAL_FILE_NAME" ]]; then
              echo "file_name=$MANUAL_FILE_NAME" >> "$GITHUB_OUTPUT"
            fi
            if [[ -n "$MANUAL_PUBLISH_AT" ]]; then
              echo "publish_at=$MANUAL_PUBLISH_AT" >> "$GITHUB_OUTPUT"
            fi
          fi

          FILE_NAME_VALUE="$(grep '^file_name=' "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2-)"
          PUBLISH_AT_VALUE="$(grep '^publish_at=' "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2-)"
          if [[ -n "$FILE_NAME_VALUE" && ! "$FILE_NAME_VALUE" =~ ^[A-Za-z0-9._-]+\.mp4$ ]]; then
            echo "::error::Invalid filename; expected a simple .mp4 filename."
            exit 1
          fi
          if [[ -n "$PUBLISH_AT_VALUE" && ! "$PUBLISH_AT_VALUE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.000Z$ ]]; then
            echo "::error::PARAMETER_ERROR: publish_at must be UTC ISO-8601, e.g. 2026-10-22T10:00:00.000Z"
            exit 1
          fi

          # Exact-file scheduling requires both values; never silently use a slot default.
          if [[ -n "$MANUAL_FILE_NAME" || -n "$MANUAL_PUBLISH_AT" ]]; then
            if [[ -z "$FILE_NAME_VALUE" || -z "$PUBLISH_AT_VALUE" ]]; then
              echo "::error::PARAMETER_ERROR: file_name and publish_at must both be provided for an exact-file schedule."
              exit 1
            fi
            if ! PUBLISH_EPOCH="$(date -u -d "$PUBLISH_AT_VALUE" +%s 2>/dev/null)"; then
              echo "::error::PARAMETER_ERROR: publish_at could not be parsed as a real UTC date/time."
              exit 1
            fi
            NOW_EPOCH="$(date -u +%s)"
            if (( PUBLISH_EPOCH <= NOW_EPOCH + 60 )); then
              echo "::error::PARAMETER_ERROR: publish_at must be more than 60 seconds in the future; refusing slot-default fallback."
              exit 1
            fi
          fi

      - name: Validate required secret
        if: steps.slot.outputs.skip != 'true'
        env:
          MIRA_AUTOMATION_SECRET: ${{ secrets.MIRA_AUTOMATION_SECRET }}
        shell: bash
        run: |
          if [[ -z "$MIRA_AUTOMATION_SECRET" ]]; then
            echo "::error::GitHub Actions secret MIRA_AUTOMATION_SECRET is not configured."
            exit 1
          fi

      - name: Call authenticated Mira scheduler
        if: steps.slot.outputs.skip != 'true'
        env:
          MIRA_BASE_URL: https://qkn0.up.railway.app
          MIRA_AUTOMATION_SECRET: ${{ secrets.MIRA_AUTOMATION_SECRET }}
          SLOT: ${{ steps.slot.outputs.slot }}
          MODE: ${{ steps.slot.outputs.mode }}
          FILE_NAME: ${{ steps.slot.outputs.file_name }}
          PUBLISH_AT: ${{ steps.slot.outputs.publish_at }}
        shell: bash
        run: |
          response_file="$(mktemp)"
          echo "Resolved request parameters: slot=$SLOT mode=$MODE file_name=${FILE_NAME:-<empty>} publish_at=${PUBLISH_AT:-<empty>}"
          payload="$(jq -n \
            --arg slot "$SLOT" \
            --arg mode "$MODE" \
            --arg fileName "$FILE_NAME" \
            --arg publishAt "$PUBLISH_AT" \
            '{confirm:true,slot:$slot,mode:$mode,fileName:$fileName,publishAt:$publishAt}')"
          if ! jq -e --arg slot "$SLOT" --arg mode "$MODE" --arg fileName "$FILE_NAME" --arg publishAt "$PUBLISH_AT" \
            '.slot == $slot and .mode == $mode and .fileName == $fileName and .publishAt == $publishAt' <<< "$payload" >/dev/null; then
            echo "::error::PARAMETER_ERROR: generated JSON does not match resolved workflow inputs."
            exit 1
          fi
          echo "Sending slot=$SLOT mode=$MODE fileName=${FILE_NAME:-<default>} publishAt=${PUBLISH_AT:-<default>}"
          status="$(curl --silent --show-error --max-time 290 \
            -o "$response_file" -w "%{http_code}" \
            -X POST "${MIRA_BASE_URL}/api/youtube/schedule-run" \
            -H "x-mira-key: ${MIRA_AUTOMATION_SECRET}" \
            -H "Content-Type: application/json" \
            -d "$payload" || true)"
          cat "$response_file"
          if [[ "$status" != "200" ]]; then
            echo "::error::Mira schedule endpoint returned HTTP $status"
            exit 1
          fi
          if ! jq -e '.ok == true' "$response_file" >/dev/null; then
            echo "::error::Mira returned HTTP 200 but did not confirm a successful or safely skipped operation."
            exit 1
          fi
