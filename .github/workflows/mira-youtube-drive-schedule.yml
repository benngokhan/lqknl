name: Mira Drive-to-YouTube Schedule

on:
  schedule:
    # Europe/Istanbul (UTC+03): 12:30 daily, 16:30 only on non-long days, evening 20:30 normally / 21:00 on long-video days, long video 18:00 every other day.
    - cron: "20 9 * * *"
    - cron: "20 13 * * *"
    - cron: "20 17 * * *"
    - cron: "50 14 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "shorts-noon, shorts-afternoon, shorts-evening, or long"
        required: true
        type: choice
        options:
          - shorts-noon
          - shorts-afternoon
          - shorts-evening
          - long
      mode:
        description: "scheduled or immediate (publishes privately, then YouTube schedules/publication)"
        required: true
        default: scheduled
        type: choice
        options:
          - scheduled
          - immediate

permissions:
  contents: read

concurrency:
  group: mira-youtube-schedule-${{ github.event.schedule || inputs.slot || 'manual' }}
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Select scheduled slot
        id: slot
        shell: bash
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_SLOT: ${{ inputs.slot }}
          MANUAL_MODE: ${{ inputs.mode }}
        run: |
          if [[ "$EVENT_SCHEDULE" == "20 9 * * *" ]]; then
            echo "slot=shorts-noon" >> "$GITHUB_OUTPUT"
            echo "mode=scheduled" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_SCHEDULE" == "20 13 * * *" ]]; then
            echo "slot=shorts-afternoon" >> "$GITHUB_OUTPUT"
            echo "mode=scheduled" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_SCHEDULE" == "20 17 * * *" ]]; then
            echo "slot=shorts-evening" >> "$GITHUB_OUTPUT"
            echo "mode=scheduled" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_SCHEDULE" == "50 14 * * *" ]]; then
            echo "slot=long" >> "$GITHUB_OUTPUT"
            echo "mode=scheduled" >> "$GITHUB_OUTPUT"
          else
            echo "slot=$MANUAL_SLOT" >> "$GITHUB_OUTPUT"
            echo "mode=${MANUAL_MODE:-scheduled}" >> "$GITHUB_OUTPUT"
          fi

      - name: Call authenticated Mira scheduler
        env:
          MIRA_BASE_URL: https://aimira.up.railway.app
          MIRA_AUTOMATION_SECRET: ${{ secrets.MIRA_AUTOMATION_SECRET }}
          SLOT: ${{ steps.slot.outputs.slot }}
          MODE: ${{ steps.slot.outputs.mode }}
        shell: bash
        run: |
          if [[ -z "$MIRA_AUTOMATION_SECRET" ]]; then
            echo "::error::GitHub Actions secret MIRA_AUTOMATION_SECRET is not configured."
            exit 1
          fi
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --max-time 290 \
            -o "$response_file" -w "%{http_code}" \
            -X POST "${MIRA_BASE_URL}/api/youtube/schedule-run" \
            -H "x-mira-key: ${MIRA_AUTOMATION_SECRET}" \
            -H "Content-Type: application/json" \
            -d "{\"confirm\":true,\"slot\":\"${SLOT}\",\"mode\":\"${MODE}\"}" || true)"
          cat "$response_file"
          if [[ "$status" != "200" ]]; then
            echo "::error::Mira schedule endpoint returned HTTP $status"
            exit 1
          fi
          if ! jq -e '.ok == true' "$response_file" >/dev/null; then
            echo "::error::Mira returned HTTP 200 but did not confirm a successful or safely skipped operation."
            exit 1
          fi
