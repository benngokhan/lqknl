name: Mira Drive-to-YouTube Schedule

on:
  # GitHub Actions replaces the deleted Railway Cron. Times are UTC.
  # Existing daily slots plus one-off exact-file preparation on 22 Oct 2026.
  # video_16.mp4 is already scheduled for 21 Oct; use the next two files for 23 Oct at 12:45/13:00 Türkiye.
  schedule:
    - cron: "0 9 * * *"
    - cron: "0 17 * * *"
    - cron: "0 6 22 10 *"
    - cron: "30 6 22 10 *"
  workflow_dispatch:
    inputs:
      slot:
        description: "shorts-noon, shorts-afternoon, shorts-evening, or long"
        required: true
        type: choice
        options:
          - shorts-noon
          - shorts-afternoon
          - shorts-evening
          - long
      mode:
        description: "scheduled uploads privately for automatic publication; immediate publishes publicly now"
        required: true
        default: scheduled
        type: choice
        options:
          - scheduled
          - immediate

permissions:
  contents: read

concurrency:
  group: mira-youtube-schedule-${{ github.event.schedule || inputs.slot || 'manual' }}
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Select scheduled slot
        id: slot
        shell: bash
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_SLOT: ${{ inputs.slot }}
          MANUAL_MODE: ${{ inputs.mode }}
        run: |
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "file_name=" >> "$GITHUB_OUTPUT"
          echo "publish_at=" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_SCHEDULE" == "0 9 * * *" ]]; then
            echo "slot=shorts-noon" >> "$GITHUB_OUTPUT"
            echo "mode=scheduled" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_SCHEDULE" == "0 17 * * *" ]]; then
            echo "slot=shorts-evening" >> "$GITHUB_OUTPUT"
            echo "mode=scheduled" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_SCHEDULE" == "0 6 22 10 *" || "$EVENT_SCHEDULE" == "30 6 22 10 *" ]]; then
            if [[ "$(date -u +%F)" != "2026-10-22" ]]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "One-off 2026 schedule has expired; safely skipping."
              exit 0
            fi
            echo "slot=shorts-noon" >> "$GITHUB_OUTPUT"
            echo "mode=scheduled" >> "$GITHUB_OUTPUT"
            if [[ "$EVENT_SCHEDULE" == "0 6 22 10 *" ]]; then
              echo "file_name=video_17.mp4" >> "$GITHUB_OUTPUT"
              echo "publish_at=2026-10-23T09:45:00.000Z" >> "$GITHUB_OUTPUT"
            else
              echo "file_name=video_18.mp4" >> "$GITHUB_OUTPUT"
              echo "publish_at=2026-10-23T10:00:00.000Z" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "slot=$MANUAL_SLOT" >> "$GITHUB_OUTPUT"
            echo "mode=${MANUAL_MODE:-scheduled}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate required secret
        if: steps.slot.outputs.skip != 'true'
        env:
          MIRA_AUTOMATION_SECRET: ${{ secrets.MIRA_AUTOMATION_SECRET }}
        shell: bash
        run: |
          if [[ -z "$MIRA_AUTOMATION_SECRET" ]]; then
            echo "::error::GitHub Actions secret MIRA_AUTOMATION_SECRET is not configured."
            exit 1
          fi

      - name: Call authenticated Mira scheduler
        if: steps.slot.outputs.skip != 'true'
        env:
          MIRA_BASE_URL: https://qkn0.up.railway.app
          MIRA_AUTOMATION_SECRET: ${{ secrets.MIRA_AUTOMATION_SECRET }}
          SLOT: ${{ steps.slot.outputs.slot }}
          MODE: ${{ steps.slot.outputs.mode }}
          FILE_NAME: ${{ steps.slot.outputs.file_name }}
          PUBLISH_AT: ${{ steps.slot.outputs.publish_at }}
        shell: bash
        run: |
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --max-time 290 \
            -o "$response_file" -w "%{http_code}" \
            -X POST "${MIRA_BASE_URL}/api/youtube/schedule-run" \
            -H "x-mira-key: ${MIRA_AUTOMATION_SECRET}" \
            -H "Content-Type: application/json" \
            -d "{\"confirm\":true,\"slot\":\"$SLOT\",\"mode\":\"$MODE\",\"fileName\":\"$FILE_NAME\",\"publishAt\":\"$PUBLISH_AT\"}" || true)"
          cat "$response_file"
          if [[ "$status" != "200" ]]; then
            echo "::error::Mira schedule endpoint returned HTTP $status"
            exit 1
          fi
          if ! jq -e '.ok == true' "$response_file" >/dev/null; then
            echo "::error::Mira returned HTTP 200 but did not confirm a successful or safely skipped operation."
            exit 1
          fi
