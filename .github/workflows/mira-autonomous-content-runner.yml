name: Mira Manual Topic Queue Scheduler

on:
  schedule:
    # Türkiye saati (UTC+3): 09:00, 13:00, 18:00, 21:00
    - cron: "0 6,10,15,18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mira-manual-topic-scheduler
  cancel-in-progress: false

jobs:
  produce-one-manual-topic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate required secrets
        env:
          MIRA_BASE_URL: ${{ secrets.MIRA_BASE_URL }}
          MIRA_AUTOMATION_SECRET: ${{ secrets.MIRA_AUTOMATION_SECRET }}
        run: |
          test -n "$MIRA_BASE_URL" || (echo "Missing GitHub Actions secret: MIRA_BASE_URL" && exit 1)
          test -n "$MIRA_AUTOMATION_SECRET" || (echo "Missing GitHub Actions secret: MIRA_AUTOMATION_SECRET" && exit 1)
      - name: Start one manually queued topic only
        env:
          MIRA_BASE_URL: ${{ secrets.MIRA_BASE_URL }}
          MIRA_AUTOMATION_SECRET: ${{ secrets.MIRA_AUTOMATION_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST "${MIRA_BASE_URL%/}/api/automation/worker" \
            -H "x-mira-key: ${MIRA_AUTOMATION_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"manualProduce":true}'
